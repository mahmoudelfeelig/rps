services:
  rps-web:
    container_name: rps-web
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    expose:
      - "80"
    networks:
      web:
        aliases:
          - rps-web

  rps-api:
    container_name: rps-api
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "5000"
    networks:
      web:
        aliases:
          - rps-api
    volumes:
      - uploads-data:/data/uploads

networks:
  web:
    external: true

volumes:
  uploads-data:
